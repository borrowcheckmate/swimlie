# Generate the Xcode project with: brew install xcodegen && xcodegen (from this folder).
name: Swimlie
options:
  developmentLanguage: en
  createIntermediateGroups: true
  bundleIdPrefix: com.swimlie
  deploymentTarget:
    iOS: "17.0"
    watchOS: "11.0"
settings:
  base:
    # Release version from the Cargo workspace (`cargo xtask project`); `testflight` sets a unique build number.
    MARKETING_VERSION: "${SWIMLIE_VERSION}"
    CURRENT_PROJECT_VERSION: "1"
packages:
  SwimlieCore:
    path: SwimlieCore
targets:
  Swimlie:
    type: application
    platform: iOS
    sources:
      - iOS
      - Shared
      - path: ../schema/prompt.md
        buildPhase: resources
      - path: ../schema/workout.schema.json
        buildPhase: resources
      - path: ../schema/example.json
        buildPhase: resources
      - path: Watch/Workouts/css-test.json
        buildPhase: resources
      - path: ../schema/plan.schema.json
        buildPhase: resources
      - path: ../schema/plan-example.json
        buildPhase: resources
    dependencies:
      - package: SwimlieCore
      - target: SwimlieWatch
    entitlements:
      path: iOS/Swimlie.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Swimlie
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSHealthShareUsageDescription: Swimlie reads your swim workouts to show history and stats.
        NSHealthUpdateUsageDescription: Swimlie saves your swim workouts to Health.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: JSON
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.json]
    postBuildScripts:
      - name: Git commit
        basedOnDependencyAnalysis: false
        script: |
          rev=$(git -C "$SRCROOT" describe --always --dirty --abbrev=7 2>/dev/null || echo unknown)
          echo "$rev" > "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/GitCommit.txt"
    settings:
      DEVELOPMENT_TEAM: "${SWIMLIE_TEAM_ID}"
      CODE_SIGN_STYLE: Automatic
      PRODUCT_BUNDLE_IDENTIFIER: com.swimlie.swimlie
      ENABLE_USER_SCRIPT_SANDBOXING: NO
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  SwimlieWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
      - Shared
      - path: ../schema/example.json
        buildPhase: resources
    dependencies:
      - package: SwimlieCore
    entitlements:
      path: Watch/SwimlieWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Swimlie
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: true
        WKCompanionAppBundleIdentifier: com.swimlie.swimlie
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: Swimlie reads swim distance, laps and strokes during your workout.
        NSHealthUpdateUsageDescription: Swimlie saves your swim workouts to Health.
        NSMotionUsageDescription: Swimlie records motion data during swims to evaluate stroke detection.
        NSLocationWhenInUseUsageDescription: Swimlie saves where a swim starts, so your history can show the pool's name.
    postBuildScripts:
      - name: Git commit
        basedOnDependencyAnalysis: false
        script: |
          rev=$(git -C "$SRCROOT" describe --always --dirty --abbrev=7 2>/dev/null || echo unknown)
          echo "$rev" > "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/GitCommit.txt"
    settings:
      DEVELOPMENT_TEAM: "${SWIMLIE_TEAM_ID}"
      CODE_SIGN_STYLE: Automatic
      PRODUCT_BUNDLE_IDENTIFIER: com.swimlie.swimlie.watchkitapp
      ENABLE_USER_SCRIPT_SANDBOXING: NO
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  # Logic tests: the sources under test are compiled in directly (no test host), so the app's @main and HealthKit code stay out.
  SwimlieWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - Tests/Unit
      - Watch/SwimDriver.swift
      - Watch/Theme.swift
      - Shared/Sync.swift
      - Shared/Palette.swift
      - path: ../core/tests/data/recorded-swim-a
        type: folder
        buildPhase: resources
      - path: ../core/tests/data/recorded-swim-b
        type: folder
        buildPhase: resources
    dependencies:
      - package: SwimlieCore
    settings:
      DEVELOPMENT_TEAM: "${SWIMLIE_TEAM_ID}"
      CODE_SIGN_STYLE: Automatic
      PRODUCT_BUNDLE_IDENTIFIER: com.swimlie.swimlie.watchkitapp.tests
      GENERATE_INFOPLIST_FILE: YES
  # UI tests drive the watch app in the simulator (replay mode, see Tests/UI).
  SwimlieWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - Tests/UI
    dependencies:
      - target: SwimlieWatch
    settings:
      DEVELOPMENT_TEAM: "${SWIMLIE_TEAM_ID}"
      CODE_SIGN_STYLE: Automatic
      PRODUCT_BUNDLE_IDENTIFIER: com.swimlie.swimlie.watchkitapp.uitests
      GENERATE_INFOPLIST_FILE: YES
schemes:
  SwimlieWatch:
    build:
      targets:
        SwimlieWatch: [run]
  SwimlieWatchTests:
    build:
      targets:
        SwimlieWatchTests: [test]
    test:
      targets:
        - SwimlieWatchTests
  SwimlieWatchUITests:
    build:
      targets:
        SwimlieWatch: [run, test]
        SwimlieWatchUITests: [test]
    test:
      targets:
        - SwimlieWatchUITests
