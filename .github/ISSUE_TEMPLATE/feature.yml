name: Feature or task
description: Something to build, change or clean up.
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What and why
      description: One or two sentences. What changes for the swimmer or the codebase, and why it matters.
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: How to approach it
      description: Start with the relevant ARCHITECTURE.md section, then the files and functions to open. Include constraints and verification commands so a new contributor can start without reading the whole codebase.
      placeholder: |
        - ARCHITECTURE.md → <section>
        - Start in `core/src/...`: ...
        - Expose it via UniFFI and use it in `apple/iOS/...`
        - Test with `cargo test` / `cargo xtask test unit`
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Verifiable acceptance criteria; each behaviour maps to an automated test.
      placeholder: |
        - [ ] ...
        - [ ] Tests cover ...
        - [ ] `cargo xtask ci` passes (plus Apple tests if relevant)
    validations:
      required: true
