name: Bug
description: Something does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you expected and what happened instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and device
      placeholder: 0.1.0, iPhone on iOS 26, Apple Watch Series 8 on watchOS 26
  - type: textarea
    id: approach
    attributes:
      label: Where to look
      description: Optional. Relevant ARCHITECTURE.md section, module, or replay fixture (`core/tests/data/`). No personal data or real locations.
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Expected behaviour and the automated regression test that will prove the fix.
    validations:
      required: true
